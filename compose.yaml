services:
  api:
    build: .
    restart: always
    image: gradient-boosting-iris-api:v1
    ports:
      - '8002:8000'
    environment:
     DB_HOST: db
     password: ${POSTGRES_PASSWORD}
    depends_on:
     db: 
      condition: service_healthy
  
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: iris_gr
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
     - '5434:5432'
    volumes:
     - postgres_data:/var/lib/postgresql
    healthcheck:
       test: ['CMD-SHELL','pg_isready -U postgres -d iris_gr']
       interval: 5s
       timeout: 3s
       retries: 10

volumes:
  postgres_data:
